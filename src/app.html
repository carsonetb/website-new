<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link
			href="https://unpkg.com/automad-prism-themes/dist/prism-tokyo-night.css"
			rel="stylesheet"
		/>
		<link
			rel="alternate"
			type="application/rss+xml"
			title="Carson Bates | RSS Feed"
			href="https://carsonetb.com/rss.xml"
		/>

		<!-- A bunch of SEO stuff, very important -->
		<meta name="description" content="carsonetb dot com" />
		<meta name="keywords" content="portfolio, personal, website" />
		<meta name="author" content="Carson Bates" />
		<meta http-equiv="content-language" content="en-US" />
		<meta property="og:title" content="carsonetb dot com" />
		<meta property="og:description" content="carsonetb dot com" />
		<!--  currently not in use, but recommended for link preview reasons
        <meta property="og:image" content="/assets/card.png" />
        -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="carsonetb dot com" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
